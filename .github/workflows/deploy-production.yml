name: Deploy production

on:
  push:
    branches:
      - production
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            be/package-lock.json
            fe/package-lock.json

      - name: Build backend
        working-directory: be
        run: |
          npm ci
          npx prisma generate
          npm run build

      - name: Build frontend
        working-directory: fe
        env:
          VITE_API_URL: https://api.ankhang.name.vn
        run: |
          npm ci
          npm run build

  deploy:
    name: Deploy to VPS
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/production'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}
          GIT_BRANCH: production
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script_stop: true
          envs: DEPLOY_PATH,VITE_API_URL,PM2_APP_NAME,GIT_BRANCH
          script: |
            set -euo pipefail
            export PM2_APP_NAME="${PM2_APP_NAME:-manage-tool-api}"
            bash "${DEPLOY_PATH}/scripts/deploy-production.sh"
